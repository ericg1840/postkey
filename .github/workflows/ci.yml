name: CI

# Runs on every PR and on pushes to main, so a change that breaks the build,
# fails a test, or introduces a lint error is caught before it can be merged
# and deployed rather than after.
on:
  pull_request:
  push:
    branches: ["main"]
  # GitHub occasionally drops a pull_request event and the run never appears,
  # which looks identical to a PR nobody has checked. Without this there is no
  # way to start one by hand short of closing and reopening the PR.
  workflow_dispatch:

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: installs exactly the lockfile, and
      # fails loudly if package.json and package-lock.json have drifted apart.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # The API handlers and shared auth/rate-limit helpers, via node:test —
      # no test framework to install.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
